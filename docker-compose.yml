services:
  db:
    image: mysql:8.4
    container_name: tela-login-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: tela_login
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: